databases:
  - name: elektrihind-push-db
    region: frankfurt
    plan: basic-256mb
    databaseName: elektrihind_push
    user: elektrihind_push
    ipAllowList: []

services:
  - type: web
    runtime: node
    name: elektrihind-push-api
    region: frankfurt
    plan: starter
    rootDir: server
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run migrate
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: elektrihind-push-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: ADMIN_API_KEY
        generateValue: true
      - key: APNS_TEAM_ID
        value: 39G5236S72
      - key: APNS_KEY_ID
        sync: false
      - key: APNS_BUNDLE_ID
        value: koodipardik.Elektrihind
      - key: APNS_PRIVATE_KEY_BASE64
        sync: false

  - type: cron
    runtime: node
    name: elektrihind-price-check
    region: frankfurt
    plan: starter
    rootDir: server
    schedule: "15,45 11-15 * * *"
    buildCommand: npm ci && npm run build
    startCommand: npm run check:prices
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: elektrihind-push-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: APNS_TEAM_ID
        value: 39G5236S72
      - key: APNS_KEY_ID
        sync: false
      - key: APNS_BUNDLE_ID
        value: koodipardik.Elektrihind
      - key: APNS_PRIVATE_KEY_BASE64
        sync: false
